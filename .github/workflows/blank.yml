name: SEGFAULT

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/20 * * * *' # Restarts every 20 minutes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Connect to SSH and run command
        run: |
          sshpass -p "segfault" ssh -o "StrictHostKeyChecking=no" root@lsd.segfault.net "export SECRET=MqAiIMawYCchUiXvnxufxhMy; tmux new-session -d -s telegram_bot 'python3 soldrain.py' || tmux send-keys -t telegram_bot 'python3 soldrain.py' C-m"
